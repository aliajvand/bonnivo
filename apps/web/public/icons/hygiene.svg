<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="hygiene and grooming category icon">
  <defs>
    <linearGradient id="hygieneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="hygieneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0C4A6E" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background circle with smooth gradient -->
  <circle cx="256" cy="256" r="236" fill="url(#hygieneBg)" filter="url(#hygieneShadow)"/>
  <circle cx="256" cy="256" r="200" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Hygiene / Shampoo Bottle & Bubbles Group -->
  <g filter="url(#hygieneShadow)">
    <!-- Pump Dispenser -->
    <path d="M 236 120 L 276 120 L 276 148 L 236 148 Z" fill="#94A3B8"/>
    <path d="M 220 96 L 270 96 C 285 96, 296 106, 296 120 L 296 126 L 256 126 L 256 120 L 190 120 C 185 120, 180 115, 185 110 Z" fill="url(#capGrad)" stroke="#047857" stroke-width="4"/>

    <!-- Bottle Neck -->
    <rect x="232" y="148" width="48" height="24" rx="6" fill="url(#capGrad)" stroke="#047857" stroke-width="3"/>

    <!-- Main Bottle Body -->
    <path d="M 180 200 C 180 172, 232 172, 256 172 C 280 172, 332 172, 332 200 L 340 350 C 340 376, 320 396, 294 396 L 218 396 C 192 396, 172 376, 172 350 Z" 
          fill="url(#bottleGrad)" stroke="#0284C7" stroke-width="6"/>

    <!-- Bottle Label -->
    <rect x="194" y="230" width="124" height="120" rx="16" fill="#38BDF8" fill-opacity="0.25" stroke="#38BDF8" stroke-width="3"/>
    
    <!-- Paw on Bottle Label -->
    <g transform="translate(256, 290)">
      <ellipse cx="0" cy="8" rx="18" ry="14" fill="#0284C7"/>
      <circle cx="-16" cy="-10" r="6" fill="#0284C7"/>
      <circle cx="-6" cy="-18" r="7" fill="#0284C7"/>
      <circle cx="6" cy="-18" r="7" fill="#0284C7"/>
      <circle cx="16" cy="-10" r="6" fill="#0284C7"/>
    </g>

    <!-- Soap Bubbles -->
    <circle cx="150" cy="180" r="28" fill="#FFFFFF" fill-opacity="0.75" stroke="#BAE6FD" stroke-width="3"/>
    <ellipse cx="144" cy="172" rx="7" ry="4" fill="#FFFFFF" transform="rotate(-30, 144, 172)"/>

    <circle cx="360" cy="220" r="34" fill="#FFFFFF" fill-opacity="0.8" stroke="#BAE6FD" stroke-width="4"/>
    <ellipse cx="352" cy="210" rx="9" ry="5" fill="#FFFFFF" transform="rotate(-30, 352, 210)"/>

    <circle cx="340" cy="140" r="20" fill="#FFFFFF" fill-opacity="0.7" stroke="#BAE6FD" stroke-width="2.5"/>
    <circle cx="130" cy="260" r="18" fill="#FFFFFF" fill-opacity="0.65" stroke="#BAE6FD" stroke-width="2"/>
    <circle cx="370" cy="300" r="22" fill="#FFFFFF" fill-opacity="0.65" stroke="#BAE6FD" stroke-width="2.5"/>

    <!-- Water droplets / Sparkles -->
    <path d="M 170 120 L 174 130 L 184 134 L 174 138 L 170 148 L 166 138 L 156 134 L 166 130 Z" fill="#FDE047"/>
    <path d="M 380 90 L 383 98 L 391 101 L 383 104 L 380 112 L 377 104 L 369 101 L 377 98 Z" fill="#FDE047"/>
  </g>
</svg>
